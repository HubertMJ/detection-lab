# The detection lab's runner image, ghcr.io/hubertmj/detection-lab/lab-runner: the python
# generator/validator/driver (lab/) in a minimal, nonroot, read-only-root container a cluster CronJob
# runs once a day. Tested (python unittest), built, Trivy-gated, described by an SPDX SBOM and signed
# keylessly with cosign -- the same pipeline as build-image.yml's web image. The cluster's Kyverno
# admits the image only with a signature whose identity is this file on main; it is the same
# detection-lab workflow identity the web image uses, so one policy trusts both.
#
# Every action is pinned to a full commit SHA with the tag it corresponded to in a comment;
# a tag is mutable, a commit is not.
name: build-runner

on:
  push:
    branches: [main]
    paths: ["lab/**", "runner/**", ".github/workflows/build-runner.yml"]
  pull_request:
    paths: ["lab/**", "runner/**", ".github/workflows/build-runner.yml"]
  workflow_dispatch:

concurrency:
  group: build-runner-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: ghcr.io/hubertmj/detection-lab/lab-runner

jobs:
  # The generator/validator/driver unit tests (stdlib only). A failing suite never reaches a build.
  unittest:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: unit tests (stdlib unittest)
        run: python3 -m unittest discover -s test -p 'test_*.py' -v

  # Pull requests stop at the tests: only main builds, pushes and signs.
  build:
    needs: unittest
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write        # push to GHCR
      id-token: write        # OIDC token for cosign keyless signing
      security-events: write # Trivy SARIF -> code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No `latest`: the cluster pins digests and forbids it.
      - name: tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            ski.hubertjablon.ci.run-id=${{ github.run_id }}

      # provenance/sbom off so the pushed digest is the image manifest cosign signs; the SBOM is made
      # and attested explicitly below. The context is the repository root so the image can copy lab/.
      - name: build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: runner/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The gate, on the digest actually pushed. A failed gate means the digest is never signed, so
      # Kyverno never admits it.
      - name: trivy gate (CRITICAL,HIGH)
        id: gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # The same scan for the Security tab, unfixed CVEs included; never the verdict.
      - name: trivy sarif
        id: sarif
        if: always() && steps.build.outputs.digest != '' && (steps.gate.outcome == 'success' || steps.gate.outcome == 'failure')
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: "true"
          TRIVY_SKIP_JAVA_DB_UPDATE: "true"
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "0"
          skip-setup-trivy: true

      # Code scanning is not on every plan (private repositories need it enabled), so an upload
      # problem must not turn a good build red.
      - name: upload sarif
        if: always() && steps.sarif.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: trivy-image-lab-runner

      - name: sbom (spdx json)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: upload sbom
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-spdx-lab-runner-${{ github.sha }}
          path: sbom.spdx.json
          if-no-files-found: error

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: cosign sign
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: cosign attest sbom
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## detection-lab runner image published

          \`\`\`
          ${IMAGE}@${DIGEST}
          \`\`\`

          Pin this digest in self-defending-portfolio's cluster CronJob for the daily lab run.
          SUMMARY
