# The detection lab's web image, ghcr.io/hubertmj/detection-lab/lab: tested, built, Trivy-gated,
# described by an SPDX SBOM and signed keylessly with cosign. The same pipeline as
# hubertjablon.ski's build-image.yml, for the web app under web/. The cluster's Kyverno admits the
# image only with a signature whose identity is this file on main. The generator's own tests run in
# test.yml; this workflow is only the web/ image.
#
# Every action is pinned to a full commit SHA with the tag it corresponded to in a comment;
# a tag is mutable, a commit is not.
name: build-image

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/build-image.yml"]
  # README.md: its diagram is checked against web/src/diagram (a README-only change on main builds nothing).
  pull_request:
    paths: ["web/**", "README.md", ".github/workflows/build-image.yml"]
  workflow_dispatch:

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

env:
  IMAGE: ghcr.io/hubertmj/detection-lab/lab

jobs:
  # Lint, unit tests and the bundle run inside the image's builder stage. The browser tests run here,
  # with read access only: the whole devDependency tree never sits next to the signing token.
  e2e:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      # The image's builder stage runs the unit tests too, but without README.md: here the diagram's
      # freshness check (README's mermaid is the model's) runs as well.
      - name: unit tests and the README diagram
        run: |
          npm ci --ignore-scripts
          npm test
          npm run diagram -- --check

      - name: e2e tests (playwright, chromium and firefox)
        run: |
          npx playwright install --with-deps chromium firefox
          npm run test:e2e

      # The image's builder stage sees web/ alone (its Docker context), and runs lint + unit tests
      # there: build it here too (not pushed), so a test that needs the rest of the repository fails
      # in the pull request, not on main (as it did at 7a3d703).
      - name: image builds from web/ alone (not pushed)
        run: docker build --quiet --tag lab-pr-check .

      - name: upload playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.sha }}
          path: web/playwright-report
          if-no-files-found: ignore

  # Pull requests stop at the tests: only main builds, pushes and signs.
  build:
    needs: e2e
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write        # push to GHCR
      id-token: write        # OIDC token for cosign keyless signing
      security-events: write # Trivy SARIF -> code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No `latest`: the cluster pins digests and forbids it.
      - name: tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            ski.hubertjablon.ci.run-id=${{ github.run_id }}

      # provenance/sbom off so the pushed digest is the image manifest cosign signs; the SBOM is made
      # and attested explicitly below.
      - name: build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: web
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            CI_RUN_ID=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The gate, on the digest actually pushed. A failed gate means the digest is never signed, so
      # Kyverno never admits it.
      - name: trivy gate (CRITICAL,HIGH)
        id: gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      # The same scan for the Security tab, unfixed CVEs included; never the verdict.
      - name: trivy sarif
        id: sarif
        if: always() && steps.build.outputs.digest != '' && (steps.gate.outcome == 'success' || steps.gate.outcome == 'failure')
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_SKIP_DB_UPDATE: "true"
          TRIVY_SKIP_JAVA_DB_UPDATE: "true"
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          limit-severities-for-sarif: true
          exit-code: "0"
          skip-setup-trivy: true

      # Code scanning is not on every plan (private repositories need it enabled), so an upload
      # problem must not turn a good build red.
      - name: upload sarif
        if: always() && steps.sarif.outcome == 'success'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: trivy-image-lab

      - name: sbom (spdx json)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: upload sbom
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-spdx-lab-${{ github.sha }}
          path: sbom.spdx.json
          if-no-files-found: error

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: cosign sign
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: cosign attest sbom
        run: cosign attest --yes --predicate sbom.spdx.json --type spdxjson "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<SUMMARY
          ## detection-lab web image published

          \`\`\`
          ${IMAGE}@${DIGEST}
          \`\`\`

          Pin this digest in self-defending-portfolio's cluster/ manifests for /lab/.
          SUMMARY
