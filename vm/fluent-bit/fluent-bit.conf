# Fluent Bit on the isolated lab VM (variant B). Reads Sysmon for Linux events from the journal,
# keeps only this run's canary events and maps them to the sdp-lab shape (sysmon_to_lab.lua), and
# ships them to siem01 over mTLS as the lab-vm-shipper identity. The VM's only egress is siem01, so
# this is the one thing that leaves the host. Deployed read-only by the provisioning; the client
# cert/key and CA are the only secret on the VM.
[SERVICE]
    Flush             2
    Daemon            Off
    Log_Level         info
    # Loopback metrics only, so run-and-ship.sh can wait for the queue to drain before poweroff.
    HTTP_Server       On
    HTTP_Listen       127.0.0.1
    HTTP_Port         2020
    storage.path      /var/lib/fluent-bit/buffer
    storage.sync      normal
    storage.metrics   on

# Sysmon for Linux writes each event to the journal as a Windows-Sysmon XML document. Match the
# sysmon process a couple of ways so a journald identifier change does not silently stop ingest.
[INPUT]
    Name                systemd
    Tag                 lab.sysmon
    Systemd_Filter      _COMM=sysmon
    Systemd_Filter      SYSLOG_IDENTIFIER=sysmon
    Systemd_Filter      SYSLOG_IDENTIFIER=Sysmon
    Systemd_Filter_Type Or
    Read_From_Tail      On
    Strip_Underscores   On
    DB                  /var/lib/fluent-bit/journal-sysmon.db
    storage.type        filesystem

# Project each canary event to the sdp-lab shape; drop everything else (other pids, other events).
[FILTER]
    Name   lua
    Match  lab.sysmon
    Script /etc/fluent-bit/sysmon_to_lab.lua
    Call   cb_sysmon

# One data stream, sdp-lab, create-only (append; never rewrite), mTLS as lab-vm-shipper. Same output
# settings as the cluster's shipper so the documents are byte-identical in shape to variant A's.
[OUTPUT]
    Name                opensearch
    Match               lab.sysmon
    Host                10.4.2.10
    Port                9200
    Index               sdp-lab
    Write_Operation     create
    Suppress_Type_Name  On
    Logstash_Format     Off
    Replace_Dots        Off
    Compress            gzip
    Trace_Error         On
    tls                 On
    tls.verify          On
    tls.ca_file         /etc/lab/siem/ca.crt
    tls.crt_file        /etc/lab/siem/tls.crt
    tls.key_file        /etc/lab/siem/tls.key
    Retry_Limit         5
